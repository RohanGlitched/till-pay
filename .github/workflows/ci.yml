name: CI
# Third-party actions are pinned to commit SHAs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - name: Unit and fuzz tests
        working-directory: contracts
        run: forge test -vv
      - name: Rehearsal on a Monad testnet fork with Agora AUSD
        working-directory: contracts
        run: forge test --match-contract Fork --fork-url https://testnet-rpc.monad.xyz -vv

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npx tsc --noEmit
      - working-directory: web
        run: npm run build
        env:
          NEXT_PUBLIC_TILL_ADDRESS: "0xeb6c2c519c9bcc4495364c34ac116c20098113d1"
          NEXT_PUBLIC_FORWARDER_ADDRESS: "0xB0Af71Dfb11df900B2B1a63De0D156e7f035B4D1"
